<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" ry="8" fill="#020d02"/>
  <!-- Terminal prompt: ">_" in matrix green with glow -->
  <g filter="url(#glow)">
    <path d="M 14 18 L 28 32 L 14 46 L 18 46 L 32 32 L 18 18 Z" fill="#00ff41"/>
    <rect x="34" y="40" width="16" height="6" fill="#00ff41"/>
  </g>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
