server {
    listen 80;
    server_name _;

    # ── Static game files — served under /hackerzork/ ─────────────────────────
    # HAProxy routes path_beg /hackerzork to this server.
    # 'alias' (not 'root') strips the /hackerzork/ prefix before looking up the file.
    location /hackerzork/ {
        alias /opt/hackerzork/repo/website/;
        index game.html;
        try_files $uri =404;
    }

    # ── WebSocket reverse proxy — /ws → Python ws_server ──────────────────────
    # HAProxy routes path == /ws to this server.
    # No /hackerzork prefix — the WS_URL in game.html is always wss://host/ws.
    location /ws {
        proxy_pass            http://127.0.0.1:8765;
        proxy_http_version    1.1;

        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      X-Real-IP  $remote_addr;
        proxy_set_header      Host       $host;

        # Match HZ_SESSION_TIMEOUT (1800s) so idle sessions don't get cut
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
        proxy_connect_timeout 10s;
    }

    # ── Direct IP fallback (LAN debug access via http://10.1.40.101/) ─────────
    # Lets you hit http://10.1.40.101/game.html directly without going through
    # HAProxy. Not used in production — HAProxy handles all real traffic.
    location / {
        root  /opt/hackerzork/repo/website;
        index game.html;
        try_files $uri =404;
    }
}
