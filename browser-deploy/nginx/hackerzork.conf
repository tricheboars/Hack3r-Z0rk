server {
    listen 80;
    server_name _;   # catch-all — replace with hostname when DNS resolves

    # Static frontend (game.html + assets)
    root /opt/hackerzork/repo/website;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket reverse proxy — /ws → Python server
    location /ws {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   Host       $host;

        # Match HZ_SESSION_TIMEOUT (1800 s) so idle sessions don't get killed
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;
        proxy_connect_timeout 10s;
    }
}

